[project]
name = "llm-finetune-skills"
version = "0.0.0"
description = "Claude skills for fine-tuning LLMs locally and serving them (tests and tooling only, not a package)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "jinja2",
    "pre-commit",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/<skill>/ mirrors skills/<skill>/, so test files of different skills may share a name
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# explicit instead of the ruff defaults, which change between versions
select = ["E4", "E7", "E9", "F", "B", "I", "S113", "T20", "UP"]

[tool.ruff.lint.per-file-ignores]
# the scripts are command line tools, printing is their output
"skills/*/scripts/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-third-party = ["unsloth"]
